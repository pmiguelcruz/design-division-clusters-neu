  <style>
    *{box-sizing:border-box}
    :root{font-family:Graphik,sans-serif;font-weight:500;color:#000;background:#00eaff;color-scheme:light}
    body{margin:0;min-height:100vh;background:linear-gradient(145deg,#00eaff 0%,#bb44ff 32%,#ff008c 65%,#ffef00 100%);background-attachment:fixed}
    header{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:18px 32px 0;flex-wrap:wrap}
    h1{font:500 21px/1.3 Graphik,sans-serif;letter-spacing:-.55px;margin:0}
    .subheading{color:#000;font-size:12px;margin:8px 0 0;line-height:1.5}
    .view-switch{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .view-switch a{font:500 12px Graphik,sans-serif;color:#000;text-decoration:none;padding:6px 0}
    .view-switch a[aria-current="page"]{border-bottom:2px solid #000}
    .exports{display:flex;gap:19px;white-space:nowrap}
    button{font:500 11px Graphik,sans-serif;color:#000;padding:6px 0;background:none;border:0;cursor:pointer}
    button:hover{color:#000}
    button:focus-visible,a:focus-visible{outline:2px solid #333;outline-offset:5px}
    main{margin:0}
    #figure{display:block;width:100%;overflow:hidden;background:transparent}
    .portrait{cursor:grab;outline:none;touch-action:none}
    .portrait:active{cursor:grabbing}
    .draggable-label{cursor:grab;touch-action:none;user-select:none}
    .draggable-label:active{cursor:grabbing}
    .portrait .focus-ring{stroke:#000;stroke-width:1.5;fill:none;opacity:0;pointer-events:none}
    .portrait:hover .focus-ring,.portrait:focus-visible .focus-ring{opacity:1}
    .group-label{font:500 17px Graphik,sans-serif;fill:#000;letter-spacing:-.2px;text-anchor:middle}
    .group-count{font:500 12px Graphik,sans-serif;fill:#000;text-anchor:middle}
    #tooltip{position:fixed;z-index:5;pointer-events:none;padding:12px 15px;background:linear-gradient(125deg,#fbd6ed,#c8f5ff);border:1px solid #00000018;border-radius:3px;box-shadow:0 5px 22px #0000000b;max-width:min(350px,calc(100vw - 28px));font-size:12px;line-height:1.5}
    #tooltip[hidden]{display:none}

  <script>function updateMotionControl(button,enabled){
  const label=enabled?'Pause motion':'Resume motion';
  button.setAttribute('aria-pressed',String(!enabled));
  button.setAttribute('aria-label',label);
  button.title=label;
}
function updatePngControl(button,state='idle'){
  const label=state==='saving'?'Saving PNG':state==='error'?'Retry PNG download':'Save PNG';
  button.dataset.state=state;
  button.disabled=state==='saving';
  button.setAttribute('aria-busy',String(state==='saving'));
  button.setAttribute('aria-label',label);
  button.title=label;
}
</script>
